<div class="app-container">
  <header>
    <h1>🌐 Consumidor de API con Angular</h1>
    <p>Actividad Sara Itzel García Velásquez</p>
    <div class="stats">
      <span class="stat-item main-stat">{{ getAllStats() }}</span>
      <span class="stat-item active-stat">{{ getActiveStats() }}</span>
    </div>
  </header>
  
  <nav class="navigation">
    <div class="nav-container">
      <button 
        *ngFor="let section of sections" 
        class="nav-button"
        [class.active]="activeSection === section.id"
        (click)="setActiveSection(section.id)">
        <span class="nav-icon">{{ section.icon }}</span>
        <span class="nav-text">{{ section.name }}</span>
        <span class="nav-count" *ngIf="!loading">
          {{ section.id === 'users' ? totalUsers : totalPosts }}
        </span>
      </button>
    </div>
  </nav>
  
  <main class="main-content">
    <div class="content-wrapper">
      <div class="section-transition">
        <app-users *ngIf="activeSection === 'users'"></app-users>
        <app-posts *ngIf="activeSection === 'posts'"></app-posts>
      </div>
    </div>
  </main>
</div>
