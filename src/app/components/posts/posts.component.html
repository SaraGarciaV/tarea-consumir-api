<div class="posts-container">
  <h2>📝 Lista de Posts</h2>
  
  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Cargando posts...</p>
  </div>

  <div *ngIf="!loading && posts.length > 0" class="posts-grid">
    <div *ngFor="let post of posts" class="post-card">
      <div class="post-header">
        <span class="post-id">#{{ post.id }}</span>
        <span class="user-id">Usuario {{ post.userId }}</span>
      </div>
      <h3>{{ truncateText(post.title, 50) }}</h3>
      <p class="post-body">{{ truncateText(post.body, 120) }}</p>
      <div class="post-footer">
        <button class="read-more-btn">Leer más</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && posts.length === 0" class="no-data">
    <p>No se encontraron posts.</p>
  </div>
</div>
